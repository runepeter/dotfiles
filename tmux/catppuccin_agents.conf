# vim:set ft=tmux:
# Custom Catppuccin-modul: agent-fleet på tvers av alle sesjoner.
# MÅ sources ETTER run tpm — status_module.conf ekspanderer separator-
# opsjonene ved set-tid, så pluginens defaults må finnes først.
%hidden MODULE_NAME="agents"

set -ogq "@catppuccin_${MODULE_NAME}_icon" " 󰚩 "
set -ogq "@catppuccin_${MODULE_NAME}_color" "#{?#{==:#{@fleet_worst},error},#{E:@thm_red},#{?#{==:#{@fleet_worst},waiting},#{E:@thm_yellow},#{E:@thm_green}}}"
set -ogq "@catppuccin_${MODULE_NAME}_text" " #(~/.config/tmux/agent-fleet.sh)"

source -F "#{d:current_file}/plugins/tmux/utils/status_module.conf"
