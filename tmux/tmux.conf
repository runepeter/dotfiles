# ============================================================================
# tmux config — multi-agent Claude Code oppsett (Catppuccin via TPM)
# ============================================================================

# --- Grunninnstillinger ------------------------------------------------------
set -g prefix C-b

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 50000
set -g escape-time 0
set -g mouse on
set -g focus-events on

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-ghostty:Tc"
set -g extended-keys on
set -g allow-passthrough on
set -as terminal-features 'xterm*:extkeys'
set -g bell-action any

# --- Navigasjon (vim-style) --------------------------------------------------
bind '"' split-window -v
bind % split-window -h

bind c run-shell 'd=#{q:pane_current_path}; [ -d "$d" ] || d="$HOME"; tmux new-window -t #{q:session_id}: -c "$d"'

# --- Pane og status (ikke tema-spesifikke) -----------------------------------
set -g pane-border-status top
set -g allow-rename off
setw -g automatic-rename off
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 60
set -g status-justify centre

# --- Monitoring ---------------------------------------------------------------
setw -g monitor-activity on
setw -g monitor-bell on
set -g visual-activity off

# Auto-navngi vinduer fra agent/worktree-navn (gjenbruker pane-agent-name.sh)
set-hook -g after-new-window 'run-shell "n=\"$(~/.config/tmux/pane-agent-name.sh \"#{pane_current_path}\")\"; [ \"$n\" != \"-\" ] && tmux rename-window -t #{window_id} \"$n\" || true"'
set-hook -g pane-focus-in 'run-shell "n=\"$(~/.config/tmux/pane-agent-name.sh \"#{pane_current_path}\")\"; [ \"$n\" != \"-\" ] && tmux rename-window -t #{window_id} \"$n\" || true"'

# --- Statusbar og paner (Catppuccin-palett @thm_*) -----------------------------
# Sources FØR tpm: continuum wrapper status-right med autosave-hooken sin ved
# plugin-load, og Catppuccin v2 setter aldri status-left/right selv.
source-file ~/.config/tmux/status.conf
source-file ~/.config/tmux/panes.conf

# --- Plugins (TPM) -------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @catppuccin_flavor 'mocha'
# 'none': Catppuccin rører ikke window-status-format — agent-state-formatene
# i status.conf eier window-lista.
set -g @catppuccin_window_status_style 'none'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.config/tmux/plugins/tpm/tpm'

# Custom fleet-modul — MÅ stå etter run tpm (trenger pluginens separator-
# defaults ved bygging, se kommentar i modulfila).
source-file ~/.config/tmux/catppuccin_agents.conf
