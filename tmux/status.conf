# status.conf — statusbar på Catppuccin-palett (@thm_*). Sources FØR tpm;
# @thm_*-variablene settes av catppuccin ved plugin-load og resolves ved render.
# session-modulen flipper farge grønn→rød når prefix er aktiv (innebygd logikk)
set -g status-left "#(~/.config/tmux/agent-liveness.sh)#{E:@catppuccin_status_session} "
# agents = custom fleet-modul (catppuccin_agents.conf), teller på tvers av sesjoner
set -g status-right "#{E:@catppuccin_status_agents}#[bg=#{@thm_surface_0},fg=#{@thm_fg}]  %d-%b#[bg=#{@thm_mauve},fg=#{@thm_crust},bold]  %H:%M  "
set -g window-status-separator ""

# Agent-tilstandsfarge: error=rød, waiting=gul, running=grønn,
# done=teal, stale=dim+markør, ellers dim.
# NB: samme farge-/prioritetsmapping er duplisert i agent-inbox.sh (render) —
# endres den ene, endre begge.
set -g window-status-format "#{?#{==:#{@agent_state},error},#[fg=#{@thm_red} bold],#{?#{==:#{@agent_state},waiting},#[fg=#{@thm_yellow} bold],#{?#{==:#{@agent_state},running},#[fg=#{@thm_green}],#{?#{==:#{@agent_state},done},#[fg=#{@thm_teal}],#[fg=#{@thm_overlay_0}]}}}}  #{window_index}:#{window_name}#{?#{==:#{@agent_state},stale}, ·,}#{?window_bell_flag, ◉,#{?window_activity_flag, ○,}}  "
set -g window-status-current-format "#[bg=#{@thm_mauve},fg=#{@thm_crust},bold]  #{window_index}:#{window_name}  #[default]"
