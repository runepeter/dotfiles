# panes.conf — pane-border på Catppuccin-palett (@thm_*). Sources FØR tpm.
# NB: pane-border-lines og clock-mode-colour settes direkte
# (tmux 3.6a støtter ikke #{@...}-format for enum/colour-options).
# Vim-style pane-nav (gjør kommentaren i tmux.conf sann)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Popups (tmux 3.2+)
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "lazygit"
bind o display-popup -E -w 70% -h 60% "$SHELL"
bind w choose-tree -Zw

# sesh worktree/session-switcher (binær fra Task 6)
# connect kjøres via run-shell (ytre klient) så switch-client treffer riktig;
# kun fzf-velgeren er i popup (fzf-tmux -p). display-popup rundt connect ville
# byttet sesjon for popup-klienten → «ingenting skjer» når popupen lukkes.
bind T run-shell "sesh connect \"\$(sesh list --icons | fzf-tmux -p 80%,70% --no-sort --ansi --prompt 'sesh ')\""

# Agent-inbox: prioritetssortert oversikt over agentvinduer (alle sesjoner).
# run-shell (ikke display-popup) av samme grunn som bind T — switch-client
# må treffe ytre klient; fzf-UI-et ligger i egen popup via fzf-tmux -p.
bind a run-shell "~/.config/tmux/agent-inbox.sh"

set -g pane-border-lines heavy
set -g clock-mode-colour "#cba6f7"
set -g pane-border-style "fg=#{@thm_surface_1}"
set -g pane-active-border-style "fg=#{@thm_mauve}"
set -g pane-border-format " #{?pane_active,#[bg=#{@thm_mauve} fg=#{@thm_crust} bold],#[bg=#{@thm_surface_0} fg=#{@thm_subtext_0}]} #(~/.config/tmux/pane-agent-name.sh '#{pane_current_path}') #[fg=#{@thm_overlay_1}]|#{?pane_active,#[bg=#{@thm_mauve} fg=#{@thm_crust} bold],#[bg=#{@thm_surface_0} fg=#{@thm_subtext_0}]} #{pane_current_command} #[fg=#{@thm_overlay_1}]|#{?pane_active,#[bg=#{@thm_mauve} fg=#{@thm_crust} bold],#[bg=#{@thm_surface_0} fg=#{@thm_subtext_0}]} #(cd #{pane_current_path} && git branch --show-current 2>/dev/null || echo '-') #[default]"
